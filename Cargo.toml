[package]
name = "sdcpi"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.80"
description = "On-the-fly strategy synthesis for BPMN+CPI processes"

# Six dependencies, pinned by Cargo.lock: num-bigint, num-integer,
# num-rational and num-traits for the exact arithmetic, biodivine-lib-bdd and
# oxidd for the decision diagrams. Everything else the search needs, the YAML
# reader of the fixed instance format, the seeded generator, the concurrent
# tables and the worker stacks, is written here.
[dependencies]
biodivine-lib-bdd = "0.6"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
oxidd = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
